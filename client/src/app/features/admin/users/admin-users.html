<mat-card>
  <mat-card-header>
    <mat-card-title>Users</mat-card-title>
    <mat-card-subtitle>Manage accounts and roles</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <div class="admin-actions">
      <button mat-flat-button color="primary" type="button" (click)="addUser()">Add user</button>
      <button mat-button type="button" (click)="reload()">Refresh</button>
    </div>

    @if (loading()) {
      <mat-progress-bar mode="indeterminate" />
    }

    <table mat-table [dataSource]="users()" class="admin-table">
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let user">{{ user.email }}</td>
      </ng-container>

      <ng-container matColumnDef="roles">
        <th mat-header-cell *matHeaderCellDef>Roles</th>
        <td mat-cell *matCellDef="let user">{{ user.roles.join(', ') }}</td>
      </ng-container>

      <ng-container matColumnDef="createdAtUtc">
        <th mat-header-cell *matHeaderCellDef>Created</th>
        <td mat-cell *matCellDef="let user">{{ user.createdAtUtc | date: 'mediumDate' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let user" class="admin-row-actions">
          <button mat-button type="button" (click)="editUser(user)">Edit</button>
          <button mat-button type="button" (click)="resetPassword(user)">Reset password</button>
          <button
            mat-button
            color="warn"
            type="button"
            [disabled]="user.id === currentUserId()"
            (click)="deleteUser(user)"
          >
            Delete
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>

    @if (!loading() && users().length === 0) {
      <p class="admin-empty">There are no accounts yet.</p>
    }
  </mat-card-content>
</mat-card>
