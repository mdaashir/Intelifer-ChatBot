server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The Angular app owns client-side routes, so anything that is not a real file
  # has to fall through to index.html rather than 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxied rather than called cross-origin, which is why the API needs no CORS
  # configuration at all: from the browser's point of view everything is same-origin.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /hubs/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SignalR connections are long-lived; the default 60s read timeout would kill them.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }
}
